upstream attendity_api { server api:4000; }
upstream attendity_web { server web:80; }
upstream attendity_landing { server landing:80; }

server {
  listen 80 default_server;
  server_name _ attendity.local;
  server_tokens off;
  client_max_body_size 2m;

  location /api/ {
    proxy_pass http://attendity_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /socket.io/ {
    proxy_pass http://attendity_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / { proxy_pass http://attendity_landing; }
}

server {
  listen 80;
  server_name app.attendity.local;
  server_tokens off;
  client_max_body_size 2m;

  location /api/ {
    proxy_pass http://attendity_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /socket.io/ {
    proxy_pass http://attendity_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / { proxy_pass http://attendity_web; }
}
